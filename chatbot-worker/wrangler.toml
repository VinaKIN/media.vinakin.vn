name = "vinakin-chatbot"
main = "src/index.js"
compatibility_date = "2025-06-01"

# Biến thường (không bí mật). KHÔNG đặt khóa API ở đây.
# Khóa đặt bằng: npx wrangler secret put ANTHROPIC_API_KEY (và GEMINI_API_KEY, OPENAI_API_KEY)
[vars]
# Chỉ các nguồn này được gọi từ trình duyệt (CORS), so khớp chính xác, không dùng dấu *. Nhiều nguồn cách nhau bằng dấu phẩy.
# media.vinakin.vn là tên miền riêng của trang GitHub Pages (anh Huy duyệt thêm 18/11/2026).
ALLOWED_ORIGINS = "https://vinakin.github.io,https://media.vinakin.vn"
CLAUDE_MODEL = "claude-haiku-5-5"
GEMINI_MODEL = "gemini-3.8-flash"
# Tên mô hình GPT chưa được xác nhận: điền tên mô hình văn bản hiện hành của tài khoản OpenAI trước khi dùng provider gpt.
# OPENAI_MODEL = "[CẦN XÁC NHẬN]"

# Giới hạn 20 tin nhắn mỗi IP mỗi giờ: mỗi IP một Durable Object (lưu bằng SQLite, dùng được trên gói Free).
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]
