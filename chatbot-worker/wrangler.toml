name = "vinakin-chatbot"
main = "src/index.js"
compatibility_date = "2025-06-01"

# Biến thường (không bí mật). KHÔNG đặt khóa API ở đây.
# Khóa đặt bằng: npx wrangler secret put ANTHROPIC_API_KEY (và GEMINI_API_KEY, OPENAI_API_KEY)
[vars]
# Chỉ các nguồn này được gọi từ trình duyệt (CORS), so khớp chính xác, không dùng dấu *. Nhiều nguồn cách nhau bằng dấu phẩy.
# media.vinakin.vn là tên miền riêng của trang GitHub Pages (anh Huy duyệt thêm 18/11/2026). http://media.vinakin.vn thêm 19/11/2026 vì trang chưa bắt buộc HTTPS; có thể bỏ khi đã bật Enforce HTTPS.
ALLOWED_ORIGINS = "https://vinakin.github.io,https://media.vinakin.vn,http://media.vinakin.vn"
CLAUDE_MODEL = "claude-haiku-5-5"
# Mô hình chính đổi từ gemini-3.8-flash (mô hình suy luận, 9 đến 32 giây mỗi câu, hay vượt 25 giây) sang bản lite (2,7 đến 7 giây), 19/11/2026.
GEMINI_MODEL = "gemini-3.5-flash-lite"
# Mô hình dự phòng khi Google báo quá tải (503) hoặc giới hạn tốc độ: Worker thử một lần rồi mới báo lỗi.
GEMINI_FALLBACK_MODEL = "gemini-flash-lite-latest"
# Mô hình GPT theo trang Models của OpenAI ngày 19/11/2026 (rẻ nhất). Chưa thử thật: là mô hình suy luận, 400 token có thể bị nuốt.
OPENAI_MODEL = "gpt-6-luna"
# Kho tri thuc catalog (RAG, 19/11/2026): Supabase pdf-chatbot-thu, ham match_catalog chay bang khoa CONG KHAI (SUPABASE_PUBLISHABLE_KEY, dat o duoi, khong phai secret).
# URL khong bi mat. Thieu mot trong cac bien nay thi Worker tra loi nhu cu (khong catalog).
SUPABASE_URL = "https://nipimanzkohvnydsxkve.supabase.co"
GEMINI_EMBED_MODEL = "gemini-embedding-001"
# Khoa CONG KHAI Supabase (publishable): duoc thiet ke de cong khai, chi goi duoc ham match_catalog (bang documents va match_documents bi chan 401).
# Dat o day thay vi secret vi buoc nhap qua khay nho tam hay truot. KHONG dat khoa quan tri (secret/service_role) o day.
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Or40-QyEhpxw2E8splYvzQ_RpcYw989"

# Chạy Worker gần Singapore thay vì gần người dùng. Lý do: người dùng ở Việt Nam được phục vụ bởi trung tâm dữ liệu Hong Kong (HKG),
# và Google Gemini API từ chối yêu cầu xuất phát từ Hong Kong (lỗi 400 FAILED_PRECONDITION, "User location is not supported").
[placement]
region = "aws:ap-southeast-1"

# Giới hạn 20 tin nhắn mỗi IP mỗi giờ: mỗi IP một Durable Object (lưu bằng SQLite, dùng được trên gói Free).
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]
